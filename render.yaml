services:
  - type: web
    name: realestate-whatsapp-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Applies any pending Alembic migrations on every deploy/restart before
    # starting the server. Idempotent — no-ops if the schema is current.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONIOENCODING
        value: utf-8
      - key: LANG
        value: C.UTF-8
      - key: LC_ALL
        value: C.UTF-8
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: "whatsapp:+14155238886"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: property-media
