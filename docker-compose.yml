services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadpilot
      POSTGRES_PASSWORD: leadpilot
      POSTGRES_DB: leadpilot
    ports:
      - "5433:5432"
    volumes:
      - leadpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadpilot -d leadpilot"]
      interval: 3s
      timeout: 5s
      retries: 20

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://leadpilot:leadpilot@db:5432/leadpilot
      PUBLIC_BASE_URL: http://localhost:8000
      COOKIE_SECURE: "false"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  leadpilot_pgdata:
